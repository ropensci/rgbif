        se orientó a aportar insumos para evaluar la condición de los ecosistemas
        y apoyar la toma de decisiones de manejo en el marco del DRMI (CAS, 2019;
        IAvH & ANH, 2022).","Recolección y revisión de información secundaria previa
        a campo: Antes del trabajo en campo, el equipo compiló y revisó información
        secundaria reciente disponible para cada componente biológico. Con ello se
        elaboraron listados de especies esperadas y se contextualizaron análisis previos,
        con el propósito de orientar el muestreo y fortalecer la capacidad de identificación
        taxonómica durante las jornadas.","Verificación en campo de coberturas: Durante
        las salidas de campo se realizaron recorridos en las principales coberturas
        reportadas para el área, con el fin de contrastar su correspondencia con lo
        descrito para el DRMI y asegurar que el muestreo biológico representara la
        heterogeneidad ambiental del predio (CAS, 2019; IAvH & ANH, 2022).","Caracterización
        de flora mediante transectos tipo Gentry: La estructura y composición florística
        se evaluaron mediante transectos lineales tipo Gentry (50 × 2 m), metodología
        ampliamente utilizada para evaluaciones rápidas de diversidad vegetal en ecosistemas
        tropicales (Gentry, 1982; Pedraza & Molina, 2007; Humboldt, 2021). Se establecieron
        diez transectos (100 m² cada uno) distribuidos en coberturas representativas
        (p. ej., bosque secundario, vegetación riparia y rastrojo), manteniendo una
        separación mínima de 20 m entre transectos para favorecer la independencia
        espacial de las unidades.","Censo de individuos fustales y variables registradas:
        En cada transecto se censaron todos los individuos leñosos con DAP ≥ 10 cm,
        registrando DAP (a 1,30 m), altura total estimada, estado fenológico e identificación
        taxonómica, siguiendo el esquema estándar del método (Gentry, 1982; Humboldt,
        2021).","Evaluación del estrato de regeneración con subparcelas anidadas:
        Para caracterizar la regeneración se anidaron dos subparcelas de 5 × 5 m dentro
        de cada transecto, en las cuales se censaron latizales (p. ej., DAP 5,0–9,9
        cm) e individuos juveniles. A su vez, dentro de cada subparcela se dispuso
        al menos una microparcela de 2 × 2 m para brinzales y plántulas (DAP < 2,5
        cm o altura < 1,3 m), registrando abundancia por morfoespecie, categorías
        de altura y estado de regeneración. En individuos menores a 1,3 m se midió
        el diámetro basal a 10 cm del suelo (Db10), consignando el tipo de medida
        utilizada (Humboldt, 2021).","Determinación taxonómica y validación: Las determinaciones
        botánicas se realizaron mediante claves y se contrastaron con material de
        referencia depositado en herbarios, con el fin de aumentar la consistencia
        taxonómica.","Muestreo de avifauna por recorridos en transectos fijos: La
        avifauna se evaluó mediante recorridos de observación a lo largo de transectos
        fijos, siguiendo directrices nacionales y protocolos de monitoreo participativo
        (MADS, 2018; Humboldt, 2021). Las observaciones se realizaron entre las 06:00
        y 09:00 h, en concordancia con periodos de mayor actividad diaria de las aves
        en ambientes neotropicales (Bustamante & Garitano-Zavala, 2024). Se registraron
        detecciones visuales y auditivas, apoyadas con binoculares y cámara fotográfica;
        la identificación se realizó con guía de campo y herramientas de apoyo (McMullan,
        2023).","Muestreo de mamíferos por búsqueda de indicios y fototrampeo: Los
        mamíferos medianos y grandes se evaluaron mediante recorridos de observación
        directa e indirecta y fototrampeo, conforme al protocolo propuesto para monitoreo
        de mamíferos (Díaz-Pulido & Payán-Garrido, 2012). En los recorridos se registraron
        avistamientos y evidencias indirectas (huellas, excretas, madrigueras y rastros
        de alimentación). Las cámaras trampa se instalaron aproximadamente a 40 cm
        sobre el suelo y operaron de forma continua (24 h), permaneciendo activas
        por más de tres meses. Los registros fotográficos se identificaron con literatura
        especializada y se sistematizaron en una base de datos estandarizada en formato
        Darwin Core, garantizando trazabilidad y consistencia de los metadatos (Ramírez-Chávez
        et al., 2025).","Estandarización de datos y análisis de diversidad: Los datos
        se organizaron por componente y cobertura. Para flora se calcularon densidad,
        frecuencia, dominancia e Índice de Valor de Importancia (IVI), y se evaluó
        la representatividad del muestreo mediante curvas de acumulación de especies
        (Gotelli & Colwell, 2001). Para avifauna se estructuró una matriz de presencia/ausencia
        y se estimaron riqueza, diversidad alfa y similitud entre coberturas mediante
        el índice de Jaccard. Para comparar la diversidad entre grupos y coberturas
