        de registros y estandarización en formato Darwin Core (Díaz-Pulido & Payán-Garrido,
        2012; Ramírez-Chávez et al., 2025). La diversidad se estimó y comparó entre
        coberturas y grupos biológicos mediante números de Hill y curvas de rarefacción/extrapolación
        en iNEXT (Hill, 1973; Jost, 2006; Mandujano et al., 2019; Pardo et al., 2025).","qualityControl":"Como
        control de calidad, la identificación y validación de los registros para cada
        grupo biológico se realizó con apoyo de literatura especializada y fuentes
        de referencia taxonómica, con el fin de asegurar consistencia y precisión
        en la determinación de especies. En el componente de mamíferos evaluado mediante
        cámaras trampa, los registros fotográficos se depuraron aplicando un criterio
        de independencia temporal: se consideraron eventos independientes aquellos
        separados por intervalos mínimos de 30 minutos, con el propósito de reducir
        la probabilidad de contabilizar repetidamente al mismo individuo en un corto
        lapso","methodSteps":["Definición del alcance y objetivos del levantamiento:
        Se realizó un levantamiento de información primaria en el Predio El Diviso
        con el fin de: (i) reconocer las coberturas identificadas para el DRMI Humedal
        San Silvestre y verificar su coincidencia en campo, y (ii) caracterizar la
