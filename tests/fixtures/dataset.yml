        íctica de la Reserva natural Aguas Calientes Paratebueno, Cundinamarca","contacts":[{"type":"PRINCIPAL_INVESTIGATOR","primary":false,"userId":["https://orcid.org/0000-0002-2278-7997"],"firstName":"Tatiana
        María","lastName":"Mira López","position":[],"email":[],"phone":[],"homepage":[],"address":[]}],"funding":"Universidad
        de lo Llanos","awards":[],"studyAreaDescription":"Este estudio se llevó a
        cabo en la reserva de aguas calientes ubicada en el Km 92 paratebueno, en
        el municipio de Paratebueno en el departamento de Cundinamarca (Figura 1).
        La práctica se realizó en el mes de agosto en un tramo de la quebrada de aguas
        calientes. Se eligieron tres transectos a lo largo de la quebrada (Tabla 1).
        Esta reserva se encuentra a 339 m.s.n.m. Durante el transcurso del año la
        temperatura varía entre 21°C a 32°C, humedad relativa de 85% (Pineda & Falla,
        2015). Este está conformado por una topografía de tipo montañoso ondulado
        rodeado de bosque húmedo tropical (Alfaro et al., 2013). Cuenta con diferentes
        ecosistemas como bosque de piedemonte, bosque secundario avanzado y bosque
        maduro intervenido.  Además cuenta con afloramiento de aguas subterráneas,
        aguas termales, quebrada, caño y humedales (Alfaro et al., 2013).","relatedProjects":[]},"samplingDescription":{"studyExtent":"Este
        estudio se llevó a cabo en la reserva de aguas calientes ubicada en el Km
        92 paratebueno, en el municipio de Paratebueno en el departamento de Cundinamarca
        (Figura 1). La práctica se realizó en el mes de agosto en un tramo de la quebrada
        de aguas calientes. Se eligieron tres transectos a lo largo de la quebrada
        (Tabla 1). Esta reserva se encuentra a 339 m.s.n.m. Durante el transcurso
        del año la temperatura varía entre 21°C a 32°C, humedad relativa de 85% (Pineda
        & Falla, 2015). Este está conformado por una topografía de tipo montañoso
        ondulado rodeado de bosque húmedo tropical (Alfaro et al., 2013). Cuenta con
        diferentes ecosistemas como bosque de piedemonte, bosque secundario avanzado
        y bosque maduro intervenido.  Además cuenta con afloramiento de aguas subterráneas,
        aguas termales, quebrada, caño y humedales (Alfaro et al., 2013).","sampling":"Los
        peces fueron capturados por un sistema de pesca eléctrico y red de arrastre:","methodSteps":["Pesca
        eléctrica\nEn este muestreo participaron cinco personas; uno de ellos era
        responsable de cargar el equipo de pesca que constaba de la batería, el ánodo
        con un anillo metálico por el cual circulaba la corriente, y el cátodo o cable
        expuesto sumergido en el agua para crear el circuito eléctrico. Tres o cuatro
        personas sujetaban la red de arrastre creando una barrera para capturar los
        peces adormecidos por la descarga, y también se utilizó","Pesca por arrastre
        \nPara este método se utilizó, la red equipada con una línea de plomos y otra
        de flotadores para mantenerla verticalmente. Las personas a un extremo de
        la red ingresaron al arroyo llevando la red hacia el centro realizando un
        semicírculo. Las personas del otro extremo permanecieron fijas al inicio,
        avanzando despacio hacia la orilla para recoger la red redujeron el espacio
        alternadamente entre la sección de plomos y flotadores hasta concentrar los
        peces en la parte media (Sommer, 2005)."]},"countryCoverage":[],"collections":[{"name":"Museo
        de Historia Natural Unillanos, Universidad de los Llanos","specimenPreservationMethod":"ALCOHOL","curatorialUnits":[]}],"dataDescriptions":[],"dataLanguage":"eng","purpose":"<p>El
        curso Profundización Ictiología del programa de Biología, Facultad de Ciencias
        Básicas e Ingeniería, tiene como objetivo profundizar en el estudio de las
        principales diferencias de grupos taxonómicos y los principales caracteres
        diagnósticos en peces de agua dulce y desarrollar en el estudiante la capacidad
        para afrontar estudios básicos de investigación en ictiología, aplicando metodologías
        relacionadas con hábitos alimenticios, reproducción, edad y crecimiento en
        peces. En la práctica, los estudiantes tuvieron la oportunidad de familiarizarse
        con las diferentes metodologías de captura (chinchorro, atarraya, nasas) y
        manejo, identificación y preparación de ejemplares. En la Reserva Natural
        Aguas Calientes; Se colectaron 225 ejemplares correspondientes a peces los
        cuales fueron procesados en campo para su posterior ingreso en la Colección
        Colección ictiológica del Museo de Historia Natural Unillanos (MHNU-I), Universidad
        de los Llanos, Villavicencio, Colombia.</p>","acknowledgements":"Universidad
