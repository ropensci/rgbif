        propios.","awards":[],"studyAreaDescription":"Se compilan los nombres de las
        especies de Coleoptera que se han registrado para Colombia de acuerdo con
        la literatura.","designDescription":"Toda la información presentada en estos
        listados proviene de la literatura: descripciones originales, catálogos, listados
        previos, revisiones taxonómicas y otros reportes.","relatedProjects":[],"abstract":"El
        listado de los coleópteros de Colombia es una iniciativa del Grupo Coleoptera
        de Colombia (ColeopCol, https://sites.google.com/view/coleopcol), que pretende
        compilar el listado de las especies de coleópteros registradas para Colombia
        en la literatura. El proyecto no está adscrito a ninguna institución, sino
        que nace del acuerdo entre coleopterólogos colombianos al ver la necesidad
        de compilar, organizar y difundir esta información."},"samplingDescription":{"studyExtent":"El
        listado compila los nombres de las especies de la subfamilia Dynastinae (Coleoptera:
        Scarabaeidae) que se han registrado para el territorio colombiano de acuerdo
        con la literatura.","sampling":"Se compiló información sobre los nombres,
        autores y referencias de las especies de la subfamilia Dynastinae (Coleoptera:  Scarabaeidae)
        que se han registrado para el territorio colombiano a partir de la literatura.
        El listado se obtuvo de principales referencias; Burmeister (1847); Bates,
        H. (1887); Endrödi (1966, 1985) y trabajos publicados posteriormente como
        Gasca-Álvarez y Amat García (2010) y Gasca-Álvarez et al. 2018. A nivel de
        subfamilia y tribu, se sigue la clasificación propuesta por Lawrence y Newton
        (1995), Smith (2006) y Bouchard et al. (2011).","qualityControl":"Los nombres
        fueron verificados en las descripciones originales, así como en los catálogos
        que aquí se mencionan, además de trabajos taxonómicos recientes.","methodSteps":["El
        levantamiento de las especies registradas para el país se hizo a partir del
        catálogo de Burmeister (1847) y de Endrödi (1966, 1985). Adicionalmente, fueron
        consultados trabajos más recientes para cubrir especies no incluidas en dichos
        catálogos.","La grafía y autoría de cada nombre fue verificada en los catálogos
        anteriormente mencionados y en las descripciones originales.","La distribución
        de las especies en el país, por departamento, fue compilada a través de la
        consulta de todos los artículos en los que se cita cada especie para Colombia.","Las
        referencias bibliográficas fueron compiladas a partir de descripciones originales,
        nuevos registros y actos de nomenclatura."]},"countryCoverage":[],"collections":[{"name":"California
