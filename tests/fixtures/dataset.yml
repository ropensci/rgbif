        cuidar la tierra - Agroinversiones la restauración","awards":[],"studyAreaDescription":"El
        presente estudio se desarrollará en el predio El Diviso, ubicado en el sector
        rural de Peroles, jurisdicción del municipio de Barrancabermeja, departamento
        de Santander, dentro de la subregión del Magdalena Medio colombiano. El Diviso
        forma parte de la zona de influencia del Distrito Regional de Manejo Integrado
        (DRMI) Humedal San Silvestre, área prioritaria para la conservación de ecosistemas
        acuáticos y terrestres asociados a la cuenca del caño San Silvestre y sus
        fincas colindantes (Corporación Autónoma Regional de Santander [CAS], 2019;
        IAvH & Agencia Nacional de Hidrocarburos [ANH], 2022).\nGeográficamente, el
        predio se localiza aproximadamente en las coordenadas 7°03’–7°05’ N y 73°43’–73°45’
        O, a una altitud promedio de 110 a 160 m.s.n.m. Presenta un relieve ondulado
        a suavemente colinado, con presencia de pequeñas depresiones y cursos de agua
        intermitentes que drenan hacia el sistema lagunar de San Silvestre.\nDe acuerdo
        con la clasificación de zonas de vida de Holdridge (1978), el área se encuentra
        en la transición entre Bosque Seco Tropical (Bs-T) y Bosque Húmedo Tropical
        (Bh-T), lo que le confiere una alta heterogeneidad ambiental y florística.
        El régimen climático es bimodal, con una precipitación anual promedio entre
        2.000 y 3.000 mm, temperaturas medias de 27–29 °C y humedad relativa cercana
        al 80 % (Pedraza & Molina, 2007; IAvH, 2017).\nLas coberturas vegetales presentes
        en el predio incluyen bosques secundarios en distintos grados de regeneración,
        vegetación de galería asociada a quebradas y caños, rastrojos altos y pastizales
        arbolados, y áreas abiertas con intervención antrópica moderada. Este mosaico
        de hábitats favorece la presencia de especies de flora y fauna representativas
        de la transición Bs-T/Bh-T, muchas de ellas con relevancia ecológica por su
        papel en la dispersión, polinización y regulación trófica (Martínez-Callejas
        et al., 2023; IAvH & ANH, 2022).","designDescription":"El levantamiento de
        información primaria tuvo como propósito verificar en campo la coincidencia
        de las coberturas reportadas para el DRMI Humedal San Silvestre y caracterizar
        la biodiversidad de flora, avifauna y mamíferos medianos y grandes en el Predio
        El Diviso (Barrancabermeja, Santander). Antes del trabajo de campo se recopiló
        información secundaria reciente por grupo biológico para construir listados
        de especies esperadas y contextualizar análisis previos.\nFlor:  La estructura
        y composición florística se evaluaron mediante transectos lineales tipo Gentry
        (50 × 2 m), ampliamente usados en evaluaciones rápidas de diversidad vegetal
        en ecosistemas tropicales (Gentry, 1982; Pedraza & Molina, 2007; Humboldt,
        2021). Se establecieron diez transectos en las principales coberturas (p.
        ej., bosque secundario, vegetación riparia y rastrojo), con separación mínima
        de 20 m para favorecer la independencia entre unidades de muestreo. En cada
        transecto se censaron individuos leñosos con DAP ≥ 10 cm, registrando DAP
        (1,30 m), altura total estimada, estado fenológico e identificación taxonómica.
        La regeneración se caracterizó con subparcelas anidadas (5 × 5 m) y microparcelas
        (2 × 2 m) para registrar latizales, brinzales y plántulas; en individuos <
        1,3 m se midió diámetro basal a 10 cm del suelo (Db10), indicando el tipo
        de medida utilizada. Las determinaciones taxonómicas se apoyaron en claves
        y contraste con material de referencia de herbarios. Con los datos se estimaron
        densidad, frecuencia, dominancia e Índice de Valor de Importancia (IVI), además
        de números de Hill (Gotelli & Colwell, 2001).\nAvifauna. Las aves se evaluaron
        mediante recorridos de observación a lo largo de transectos fijos, siguiendo
        las directrices del Ministerio de Ambiente y Desarrollo Sostenible (MADS,
        2018) y los protocolos de monitoreo participativo del Instituto Humboldt (2021).
        Los registros se realizaron entre 06:00 y 09:00 h, periodo asociado a picos
        de actividad en ambientes neotropicales (Bustamante & Garitano-Zavala, 2024).
        Se registraron detecciones visuales y auditivas, apoyadas con binoculares
        y cámara fotográfica, y la identificación se realizó con guía de campo y herramientas
        de identificación (McMullan, 2023). \nMamíferos medianos y grandes. Se realizaron
        recorridos para búsqueda de evidencias directas e indirectas y se implementó
        fototrampeo conforme a protocolos estandarizados (Díaz-Pulido & Payán-Garrido,
        2012). En los recorridos se registraron avistamientos y señales como huellas,
        madrigueras y rastros de alimentación. Las cámaras trampa se instalaron aproximadamente
        a 40 cm del suelo y operaron de forma continua (24 h) durante más de tres
        meses. Los registros fotográficos se clasificaron con base en literatura especializada
        (Ramírez-Chávez et al., 2025) y se sistematizaron en una base de datos estructurada
        en formato Darwin Core para asegurar trazabilidad y estandarización.\nAnálisis
        de diversidad    \nPara estimar y comparar la riqueza de la flora, la avifauna
        y los mamíferos medianos y grandes se empleó el paquete INEXT en R (Mandujano
        et al., 2019). Este paquete implementa los números de Hill o índices de diversidad
        verdadera, los cuales expresan la diversidad como el número equivalente de
        especies en las distintas comunidades y permite evaluar la completitud del
        muestreo mediante curvas de rarefacción y extrapolación (Hill, 1973; Jost,
        2006; Pardo et al., 2025).","relatedProjects":[],"abstract":"El predio El
        Diviso, ubicado en el área de influencia del Distrito Regional de Manejo Integrado
        (DRMI) Humedal San Silvestre en Barrancabermeja (Santander, Colombia), se
        caracteriza por un mosaico de coberturas vegetales representativo de la transición
        entre bosque seco tropical y bosque húmedo tropical del Magdalena Medio. El
        presente estudio tuvo como objetivo caracterizar la biodiversidad del predio
        mediante la evaluación de la composición florística, la diversidad de aves
        y la presencia de mamíferos medianos y grandes en distintas coberturas del
        paisaje.\nLa vegetación fue evaluada mediante diez transectos lineales de
        50 m siguiendo el método de Gentry, registrando individuos leñosos con diámetro
        a la altura del pecho ≥ 10 cm y estimando parámetros estructurales (densidad,
        frecuencia, dominancia e índice de valor de importancia). La diversidad se
        estimó mediante números de Hill (q0, q1 y q2). La avifauna fue registrada
        mediante recorridos de observación y registros auditivos, mientras que los
        mamíferos se documentaron mediante cámaras trampa y rastreo de huellas.\nLos
        resultados evidenciaron diferencias marcadas entre coberturas. La vegetación
        secundaria presentó los mayores valores de riqueza y diversidad florística,
        indicando estados sucesionales intermedios con mayor complejidad estructural.
        Los mosaicos de pastos con espacios naturales mostraron diversidad intermedia
        asociada a especies pioneras y de regeneración temprana, mientras que los
        pastos enmalezados exhibieron menor diversidad y mayor dominancia de especies
        oportunistas. Las zonas pantanosas presentaron comunidades vegetales más simples
        dominadas por especies tolerantes a suelos saturados. En total se registraron
        41 especies de plantas pertenecientes a 25 familias, junto ocho especies de
        mamíferos medianos y grandes, incluyendo Panthera onca y Puma concolor, así
        como 62 especies de aves asociadas principalmente a coberturas en regeneración.\nEstos
        resultados resaltan la importancia de los mosaicos de vegetación secundaria
        y humedales del DRMI Humedal San Silvestre como refugios de biodiversidad
        dentro del paisaje transformado del Magdalena Medio."},"samplingDescription":{"studyExtent":"El
        área de estudio correspondió al predio El Diviso, ubicado en el sector rural
