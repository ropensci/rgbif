        peces fueron capturados por un sistema de pesca eléctrico y red de arrastre:","methodSteps":["Pesca
        eléctrica\nEn este muestreo participaron cinco personas; uno de ellos era
        responsable de cargar el equipo de pesca que constaba de la batería, el ánodo
        con un anillo metálico por el cual circulaba la corriente, y el cátodo o cable
        expuesto sumergido en el agua para crear el circuito eléctrico. Tres o cuatro
        personas sujetaban la red de arrastre creando una barrera para capturar los
        peces adormecidos por la descarga, y también se utilizó","Pesca por arrastre
        \nPara este método se utilizó, la red equipada con una línea de plomos y otra
        de flotadores para mantenerla verticalmente. Las personas a un extremo de
        la red ingresaron al arroyo llevando la red hacia el centro realizando un
        semicírculo. Las personas del otro extremo permanecieron fijas al inicio,
        avanzando despacio hacia la orilla para recoger la red redujeron el espacio
        alternadamente entre la sección de plomos y flotadores hasta concentrar los
        peces en la parte media (Sommer, 2005)."]},"countryCoverage":[],"collections":[{"name":"Museo
