        was funded by the Ministry of the Flemish Community (het Ministerie van de
        Vlaamse Gemeenschap).","awards":[],"studyAreaDescription":"The inventory was
        made in two study areas in the Demerbeek area - in 1996, 79 hectares in the
        flooding brook ‘Hoeleden op de Velp’ and in 1997, 74.9 hectares in the brooks
        of ‘Webbekom op de Demer’. \nThe locations were recorded using GPS. The coordinate
        uncertainty was not noted, so an estimate of 10 m has been applied.","designDescription":"187
        surveys were carried out, 86 in Webbekom and 101 in Hoeleden. The plots were
        chosen to be representative of the total vegetative variation across both
        locations.","relatedProjects":[],"abstract":"As part of ongoing water management
        in Flemish valleys, the restoration of the various natural flooding mechanisms
        of alluvial rivers was being investigated. There was a lack of understanding
        of both the ecological effects of the flooding on such natural systems and
        the ecological needs of those areas. As it is difficult to study these questions
        due to ongoing (over)management of the water bodies and unpredictable flooding,
        certain areas which regularly flood were looked to for insights in the larger
        valley systems. \nIn this project, a thorough botanical inventory was drawn
        up of two valley ecosystems which frequently flood in the Demerbekken (Demer
        brooks), which were planned to be (later) used as part of flood management
        after the study. The inventory also allows for further comparative studies
        down the line. \nA number of abiotic parameters were also recorded during
        this study (not presented in this publication)."},"samplingDescription":{"studyExtent":"187
