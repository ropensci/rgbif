        of Fundy: Spiny Dogfish","description":"<p>This is the OBIS extraction of
        the Ocean Tracking Network  and Fisheries and Oceans Canada, Bedford Institute
        of Oceanography (DFO-BIO)  Bay of Fundy: Spiny Dogfish, consisting of the
        release tagging metadata, i.e. the location and date when the tagged animal
