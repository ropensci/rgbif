        presente estudio se desarrolló en el predio El Diviso, ubicado en el sector
        rural de Peroles, jurisdicción del municipio de Barrancabermeja, departamento
        de Santander, dentro de la subregión del Magdalena Medio colombiano. El Diviso
        forma parte de la zona de influencia del Distrito Regional de Manejo Integrado
        (DRMI) Humedal San Silvestre, un área prioritaria para la conservación de
        ecosistemas acuáticos y terrestres asociados a la cuenca del caño San Silvestre
        y sus fincas colindantes (Corporación Autónoma Regional de Santander [CAS],
        2019; IAvH & Agencia Nacional de Hidrocarburos [ANH], 2022).\nGeográficamente,
        el predio se localiza aproximadamente entre las coordenadas 7°03’–7°05’ N
        y 73°43’–73°45’ O, a una altitud promedio entre 110 y 160 m s. n. m. Presenta
        un relieve ondulado a suavemente colinado, con presencia de pequeñas depresiones
        y cursos de agua intermitentes que drenan hacia el sistema lagunar de San
