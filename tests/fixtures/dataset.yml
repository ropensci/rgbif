        in Flanders, Belgium","description":"<p>This dataset comprises aquatic vegetation
        surveys conducted across Flemish watercourses from the summer of 2015 onward.
        The primary objective is to define the local conservation status (LSVI) of
        Natura 2000 habitat type 3260 (Water courses of plain to montane levels with
        the Ranunculion fluitantis and Callitricho-Batrachion vegetation) in Flanders,
        in the northern part of Belgium. These plant inventories are typically conducted
