        species and new records of the family Ectopsocidae (Psocodea: ‘ Psocoptera’)
        from India","description":"<p>This dataset contains the digitized treatments
        in Plazi based on the original journal article Ramesh, Gurusamy, Babu, Rajappa,
        Subramanian, Kumarapuram A. (2026): New species and new records of the family
        Ectopsocidae (Psocodea: ‘ Psocoptera’) from India. Zootaxa 5782 (3): 449-468,
        DOI: 10.11646/zootaxa.5782.3.2, URL: https://doi.org/10.11646/zootaxa.5782.3.2</p><p>Abstract</p><p>Three
        new species of the genus Ectopsocus, namely E. bispinosus sp. nov., E. cluniatoides
        sp. nov., and E. sengaltheri sp. nov., are described and illustrated. In addition,
        four species of Ectopsocus, (E. ewarti Vaughan, Thornton &amp; New, 1989;
        E. himalayanus New, 1971; E. hypandrus Thornton, 1984; and E. meridionalis
        Ribaga, 1904), and one species of Ectopsocopsis (E. mozambica (Badonnel, 1931
        )), are reported for the first time from India. Moreover, the female of E.
        himalayanus New, 1971, is described for the first time. This study is the
        first record of the genus Ectopsocopsis from India. We also provide an updated
