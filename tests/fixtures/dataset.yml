        reportan 267 especies de la subfamilia Dynastinae (Coleoptera: Scarabaeidae)
        en 31  departamentos de Colombia. Los mayores valores de riqueza se concentraron
        en Valle del Cauca (80 spp.), Cundinamarca (77 spp.) y Antioquia (69 spp.),
        seguidos por Boyacá (62 spp.), Meta (60 spp.), Chocó (58 spp.) y Tolima (52
        spp.), todos con más de 50 especies registradas. \nEn contraste, los menores
        valores de riqueza se registraron en Vaupés (2 spp.), Guaviare (4 spp.), Guainía
        (6 spp.), Arauca (9 spp.) y La Guajira (9 spp.), departamentos para los que
        existe un número reducido de registros. En conjunto, se documentan especies
        en 31 de los 32 departamentos de Colombia, con ausencia de registros únicamente
        para San Andrés y Providencia.","boundingBox":{"minLatitude":-4.478,"maxLatitude":12.555,"minLongitude":-79.102,"maxLongitude":-66.621,"globalCoverage":false}}],"temporalCoverages":[{"@type":"range","start":"1758-01-01T00:00:00.000+00:00","end":"2025-12-31T00:00:00.000+00:00"}],"keywordCollections":[{"thesaurus":"GBIF
