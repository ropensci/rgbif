        new species complex in the genus Camponotus Mayr, 1861 (Hymenoptera: Formicidae),
        with the description of a new species","description":"<p>This dataset contains
        the digitized treatments in Plazi based on the original journal article Chan,
        Marco, Hamer, Matthew T., Guénard, Benoit (2026): A new species complex in
        the genus Camponotus Mayr, 1861 (Hymenoptera: Formicidae), with the description
        of a new species. Contributions to Entomology 76 (1): 139-158, DOI: 10.3897/contrib.entomol.76.e189240</p><p>Abstract</p><p>Orthonotomyrmex
        Ashmead, 1906 is one of the most morphologically distinct subgenera in the
        genus Camponotus Mayr, 1861 with a marginated propodeum, nodiform petiole
        and punctate sculpturing covering most of the body. Here, we propose a new
        species complex native to Southeast Asia, the Camponotus selene – complex.
        We also propose the elevation of Camponotus obtusatus (Emery, 1895) as a valid
        species, the synonymisation of C. lasiselene syn. nov. with C. obtusatus and
        describe a new species, Camponotus orthogonius sp. nov. from Hong Kong SAR.
        The type series was collected within multiple neighbouring twigs from a singular
        fallen tree suggesting a polydomic colony structure. Keys to the known species
        of the selene – complex are provided for both minor and major workers. We
        also provide new distribution data for Camponotus obtusatus stat. nov. and
        Camponotus siamensis Jaitrong &amp; Jeenthong, 2022 from Fujan Province, China
        and Laos, respectively. The proposal of the new selene – complex serves to
        facilitate future revisions Orthonotomyrmex when more Afrotropical specimens
        are available to better diagnose the subgenus. The discovery of C. orthogonius
        sp. nov., alongside newly – reported range extensions, reinforces the potential
        of further arboreal ant species discoveries in Southeast Asia.</p>","language":"eng","homepage":"https://tb.plazi.org/GgServer/summary/439767E3F0AD57E38252479FE6E86C8A","citation":{"text":"Chan
