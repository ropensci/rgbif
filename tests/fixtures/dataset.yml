        en iNEXT (Mandujano & Pérez., 2019), siguiendo los fundamentos de diversidad
        verdadera (Hill, 1973; Jost, 2006) y su aplicación en evaluaciones comparativas
        (Pardo et al., 2025)."]},"countryCoverage":[],"collections":[],"dataDescriptions":[],"dataLanguage":"spa","purpose":"<p>El
