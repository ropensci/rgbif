        indicando estados sucesionales intermedios con mayor complejidad estructural.
        Los mosaicos de pastos con espacios naturales mostraron diversidad intermedia
        asociada a especies pioneras y de regeneración temprana, mientras que los
        pastos enmalezados exhibieron menor diversidad y mayor dominancia de especies
        oportunistas. Las zonas pantanosas presentaron comunidades vegetales más simples
        dominadas por especies tolerantes a suelos saturados. En total se registraron
        41 especies de plantas pertenecientes a 25 familias, junto ocho especies de
        mamíferos medianos y grandes, incluyendo Panthera onca y Puma concolor, así
        como 62 especies de aves asociadas principalmente a coberturas en regeneración.Estos
        resultados resaltan la importancia de los mosaicos de vegetación secundaria
        y humedales del DRMI Humedal San Silvestre como refugios de biodiversidad
        dentro del paisaje transformado del Magdalena Medio</p>","introduction":"<p>El
        municipio de Barrancabermeja, localizado en el Magdalena Medio santandereano,
        se caracteriza por albergar ecosistemas de alta importancia ecológica, entre
        ellos fragmentos de bosque húmedo tropical y zonas de transición hacia el
        bosque seco tropical. Estos ecosistemas desempeñan funciones esenciales en
        la regulación hídrica, el almacenamiento de carbono, la conservación de suelos
        y el mantenimiento de la biodiversidad regional (Instituto de Investigación
        de Recursos Biológicos Alexander von Humboldt [IAvH], 2017; Alcaldía de Barrancabermeja,
        2023). Sin embargo, la expansión de la frontera agropecuaria, el desarrollo
        petrolero y la urbanización han ocasionado una fuerte fragmentación del paisaje
        natural, comprometiendo la conectividad entre los remanentes boscosos y afectando
        la integridad ecológica de la cuenca media del río Magdalena (Pedraza &amp;
        Molina, 2007; IAvH &amp; Agencia Nacional de Hidrocarburos [ANH], 2022).De
        este modo, el predio El Diviso, ubicado en el sector rural de Peroles (Barrancabermeja,
        Santander), constituye un espacio estratégico para la conservación, la restauración
        y la educación ambiental. El área, que forma parte de la zona de influencia
        del DRMI Humedal San Silvestre, representa un mosaico de coberturas que incluye
        fragmentos de bosque secundario, vegetación riparia y zonas abiertas, configurando
        un ecotono entre el bosque seco tropical (Bs-T) y el bosque húmedo tropical
        (Bh-T) (Holdridge, 1978; IAvH, 2017). Esta condición transicional favorece
        la coexistencia de especies características de ambos tipos de ecosistema,
        incrementando la diversidad biológica y el valor ecológico del sitio (IAvH
        &amp; ANH, 2022; Martínez-Callejas et al., 2023).El conocimiento de la biodiversidad
        presente en el predio es fundamental para orientar estrategias de manejo sostenible
        y conservación local. Contar con una línea base de flora, avifauna y mamíferos
        permitirá no solo identificar los principales grupos biológicos asociados
        al paisaje, sino también evaluar su estado de conservación y las posibles
        amenazas que enfrentan. Además, el estudio contribuirá a fortalecer la articulación
        entre actores locales, instituciones académicas y entidades ambientales, promoviendo
        la conservación participativa del patrimonio natural de Barrancabermeja, en
        coherencia con los objetivos del DRMI Humedal San Silvestre y las políticas
        de biodiversidad del país (MinAmbiente, 2012; IAvH, 2021).Por otro lado, y
        justamente dada la estructura de sus ecosistemas y su posición estratégica
        en la microcuenca de la Vizcaína, la cual es afluente del complejo de humedales
        de San Silvestre, el predio El Diviso fue reconocido como uno de los núcleos
        de conservación en el plan de manejo del Distrito Regional de Manejo Integrado
        – DRMI, muy relacionado con la estructura de sus bosques secundarios altos,
        de los cuales, se pueden encontrar fragmentados y dispersos en esta área protegida.
        No obstante lo anterior, la decisión de la Corporación Autónoma Regional de
        Santander – CAS, afectó en gran parte la posibilidad de adelantar proyectos
        productivos sostenibles en el mismo, la destinar el 75,52% del área a la preservación
        y el 10,22% a la restauración, dejando para el uso sostenible el 1,38% y para
        la subzona para el desarrollo el 11,13%, no solamente en un déficit definitivo
        de área productiva que permita sostener el predio, sino, además, distribuida
        en fragmentos pequeños y aislados que hacen imposible gestión eficiente del
        suelo y los recursos. En respuesta a la situación anteriormente descrita,
        el presente documento busca presentar los resultados de la caracterización
        de la estructura y la composición de la flora, las aves y los mamíferos en
        el predio, como información técnica base en el diseño de una zonificación
        predial a una escala mayor, que permita ofrecer a la Corporación CAS alternativas
        de manejo del predio dentro de lo dispuesto en el DRMI, esto con el fin de
        lograr acuerdos en la definición de usos y de proyectos productivos, que vayan
        en consonancia los objetivos de conservación del DRMI, al tiempo que permita
        evitar el detrimento en el patrimonio del propietario y la afectación directa
        sobre su economía personal. Este documento es la base para lograr el consenso
        y aporta elementos técnicos basados en estudios de primera mano, y permite
        la construcción de una visión de finca guardiana del jaguar, que apoya la
        conservación y la restauración de la conectividad funcional del paisaje, y
        que pretende desarrollar allí ejercicios productivos modelo para la transferencia
        de conocimientos y tecnologías sostenibles, oportunidades de negocios basados
        en la biodiversidad y alternativas complementarias para la economía de las
        familias del Magdalena Medio Santandereano. </p>","acknowledgements":"<p>Expresamos
        nuestro sincero agradecimiento a los propietarios del Predio El Diviso por
        confiar en la Fundación Cuidar la Tierra, facilitar el ingreso al predio y
        respaldar el desarrollo del trabajo. Agradecemos a los habitantes y demás
        colaboradores locales por su apoyo logístico, orientación en el territorio
        y acompañamiento durante las jornadas de campo.</p>","pubDate":"2026-08-12T00:00:00.000+00:00","maintenanceUpdateFrequency":"AS_NEEDED","maintenanceDescription":"","license":"http://creativecommons.org/licenses/by/4.0/legalcode","dwca":{"coreType":"http://rs.tdwg.org/dwc/terms/Occurrence","extensions":[],"modified":"2026-08-12T19:31:19.661+00:00"}}]}'
