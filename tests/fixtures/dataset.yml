        Ecosystem controls and multiple stressors in a coastal upwelling system"}],"relatedProjects":[]},"samplingDescription":{"studyExtent":"The
        CalCOFI Intercalibration Experiment was conducted during a CalCOFI cruise
        in October 2022 in the Southern California region of the California Current
        System. Sampling was conducted at 16 stations across multiple depths, including
        within or adjacent to a proposed National Marine Sanctuary. Approximately
        500 environmental DNA (eDNA) samples were collected during the cruise to evaluate
        and compare four eDNA collection and processing approaches. Environmental
        observations and measurements associated with the sampling effort included
        CTD data, visual observations of marine birds and marine mammals, and ichthyoplankton
        collections from bongo and manta nets. The study therefore encompasses seawater
        eDNA sampling and associated biological and environmental observations.","sampling":"Samples
        used for this project were collected during a California Cooperative Oceanic
        Fisheries Investigations (CalCOFI) survey in October 2022. Samples were collected
        at 16 different stations in the southern CCE across varying depths with three
        different protocols: the NOAA Rockfish Recruitment and Ecosystem Assessment
        Survey (RREAS), the Global eDNA Marine Collection and Analysis Program, and
        the NOAA-CalCOFI Ocean Genomics Project protocols. All protocols were used
        at all stations. The sampling methods targeted similar depths with some variability
        (e.g. RREAS did not sample below 100m) and filtered different volumes of water.
        Sample volume ranged from 1 to 6L, with GEMCAP averaging approximately 1L,
        RREAS approximately 2L and NCOG approximately 4.5L per sample. All samples
        were generated with water from Niskin bottles mounted on a CTD rosette filtered
        through 0.2μm pore size filters within 1h of collection.","methodSteps":["Seawater
        samples were collected from Niskin bottles mounted on a CTD rosette during
        a CalCOFI survey in October 2022. Samples were collected at 16 stations in
        the southern California Current Ecosystem across varying depths using three
        sampling protocols: the NOAA Rockfish Recruitment and Ecosystem Assessment
        Survey (RREAS), the Global eDNA Marine Collection and Analysis Program (GEMCAP),
        and the NOAA-CalCOFI Ocean Genomics Project (NCOG) protocols. Water samples
        were filtered through 0.2 μm pore-size filters within 1 hour of collection.","Environmental
        DNA was extracted from the filters and amplified using two metabarcoding assays.
        The MiFish assay targeted the mitochondrial 12S rRNA region for fish detection,
        while the cetacean-specific assay targeted the mitochondrial D-loop region
        for detection of toothed whales. Resulting sequence data were processed to
        generate taxonomic occurrence records."]},"countryCoverage":[],"collections":[],"dataDescriptions":[],"dataLanguage":"eng","acknowledgements":"This
