        Change; Ministério da Pesquisa, Inovação e Digitalização da Romênia (#760054
        - JUST4MPA, PNRR-III-C9-2022-I8); e Ministério Federal Alemão de Educação
        e Pesquisa - BMBF (16LC2025A).","awards":[],"studyAreaDescription":"Diferentes
        aldeias indígenas da terra indígenas Paquiçamba e diferentes comunidades ribeirinhas,
        que estão localizadas na região da volta grande do rio Xingu no estado do
        Pará.","designDescription":"Amostragem sistemática do crescimento, mortalidade
        e ciclos fenológicos da vegetação, dos níveis de água nas piracemas (áreas
        de reprodução dos peixes), do rendimento pesqueiro, da qualidade da água da
        chuva e do nível da água do lençol freático, do monitoramento dos ninhos de
        tracajás e do consumo dessa espécie, do monitoramento das aves e dos invertebrados
        aquáticos, além do monitoramento do consumo de caça pelas comunidades indígenas.","relatedProjects":[],"abstract":"Trata-se
        de uma aliança colaborativa entre comunidades locais, ribeirinhas e indígenas,
        e pesquisadores acadêmicos, que oferece uma visão integrada e detalhada dos
        impactos causados pela UHE Belo Monte. Os resultados obtidos pelo MATI-VGX
        destacam o papel fundamental das comunidades locais na defesa de seus direitos
        e territórios, além de fornecer subsídios para mitigar os danos e promover
        práticas menos prejudiciais aos ecossistemas e às populações da VGX."},"samplingDescription":{"studyExtent":"A
        Volta Grande do Xingu é um trecho de aproximadamente 130 km do rio Xingu,
        localizado no estado do Pará, caracterizado por seu traçado em arco, rica
        biodiversidade aquática e importância sociocultural. A região abriga comunidades
        ribeirinhas e povos indígenas que dependem diretamente dos recursos pesqueiros
        para subsistência e renda. Desde a implantação das barragens de Belo Monte
        e Pimentel, a área sofre alterações no regime hidrológico e impactos sobre
        os ecossistemas e modos de vida locais.","sampling":"O componente de monitoramento
        da vegetação do MATI-VGX iniciou-se em 2021, com o objetivo de acompanhar
        as florestas alagáveis em áreas selecionadas por povos indígenas e ribeirinhos
        com base em seus conhecimentos locais. Essas áreas foram escolhidas por sua
        importância como habitats de berçário de peixes, conhecidos localmente como
        Piracemas.\nO monitoramento é realizado por pesquisadores locais que registram
        as condições da vegetação utilizando um formulário elaborado coletivamente.
        Este formulário inclui indicadores simples, como a presença ou ausência de
        frutos caídos no solo durante o período de cheia (SIM/NÃO) (Tabela S1). As
        observações são complementadas com fotografias georreferenciadas e datadas,
        compartilhadas com todos os participantes do MATI-VGX. Para os sarobais—um
        tipo específico de vegetação que se desenvolve sobre leitos rochosos ou arenosos
        em níveis mais altos de inundação—são registradas características fenológicas
        e condições de saúde ao longo de todo o ano, por meio de documentação fotográfica.
        Atenção especial é dada às árvores mortas ou excessivamente secas (com folhas
        marrons) e à produção de frutos, ambos essenciais para a fauna aquática. Essa
        abordagem cooperativa entre especialistas locais e pesquisadores acadêmicos
        garante um processo de coleta de dados culturalmente sensível e cientificamente
        rigoroso.","qualityControl":"A identificação das espécies foi feita pelas
        comunidades com suporte técnico, utilizando chaves botânicas e, quando possível,
        registros fotográficos para confirmação posterior. Os dados de cobertura e
        altura foram medidos com instrumentos padronizados, como fitômetros e trenas.
        As informações coletadas foram registradas em planilhas e validadas em reuniões
        comunitárias, garantindo consistência e precisão antes da padronização para
        publicação.","methodSteps":["Como parte do protocolo, em 2023 foram estabelecidas
        oito parcelas permanentes de floresta de 50 × 100 m (0,5 ha) em áreas de igapó.
        Quatro parcelas foram instaladas nas ilhas Zé Maria e Ilha das Meninas, regiões
        severamente afetadas pela redução do fluxo de água e pela ausência de inundações
        após a construção da barragem. As outras quatro parcelas-controle foram estabelecidas
        a montante da barragem de Pimental, na região da Ilha Grande/Cachoeira do
        Espelho, fora da área de influência do reservatório. Essas parcelas-controle
        permitem comparações com as áreas impactadas, compensando a ausência de estudos
        de base sobre a vegetação sazonalmente alagada antes da construção da barragem.\nEm
        todas as parcelas, são avaliados o sub-bosque e as condições gerais da vegetação
        circundante, com atenção especial para espécies não características de florestas
        alagáveis, incluindo observações dos sarobais adjacentes. As árvores foram
        permanentemente marcadas, medidas e identificadas para monitorar a regeneração
        florestal, o crescimento e a mortalidade. Esse inventário inicial serve como
        linha de base para acompanhar a dinâmica das espécies arbóreas ao longo do
        tempo, com recensos periódicos planejados."]},"countryCoverage":[],"collections":[],"dataDescriptions":[],"dataLanguage":"por","pubDate":"2026-09-03T00:00:00.000+00:00","maintenanceUpdateFrequency":"UNKNOWN","maintenanceDescription":"","license":"http://creativecommons.org/licenses/by-nc/4.0/legalcode","dwca":{"coreType":"http://rs.tdwg.org/dwc/terms/Occurrence","extensions":["http://rs.iobis.org/obis/terms/ExtendedMeasurementOrFact"],"modified":"2026-09-30T07:34:51.681+00:00"}}]}'
