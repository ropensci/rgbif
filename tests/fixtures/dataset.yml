        Ambiental Territorial Independente - MATI","contacts":[{"type":"ADMINISTRATIVE_POINT_OF_CONTACT","primary":false,"userId":[],"firstName":"Monitoramento","lastName":"MATI","position":[],"email":[],"phone":[],"homepage":[],"address":[]}],"funding":"Iniciativa
        Amazônia+10 - FAPESP, concessão 2022/10323-0; FAPEAM, Resolução 023/2022;
        FAPESPA, concessão 103/2023; CNPq (concessões 307179/2021-4 e 314860/2023-1);
