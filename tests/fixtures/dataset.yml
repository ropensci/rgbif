        of the type materials of seven species of Plexippina (Araneae, Salticidae)
        from China","description":"<p>This dataset contains the digitized treatments
        in Plazi based on the original journal article Zhou, Yuchen, Peng, Xianjin
        (2026): Re-examination of the type materials of seven species of Plexippina
        (Araneae, Salticidae) from China. ZooKeys 1293: 221-239, DOI: 10.3897/zookeys.1293.203377</p><p>Abstract</p><p>The
        type specimens of seven species of the subtribe Plexippina from China are
        re-examined, and detailed illustrations of the habitus and copulatory organs
        are provided. Three species retain their current taxonomy: Evarcha wulingensis
        Peng, Xie &amp; Kim, 1993, Pancorius goulufengensis Peng, Yin, Yan &amp; Kim,
        1998, Thyene yuxiensis Xie &amp; Peng, 1995. The other four species have taxonomic
        changes and are to be treated as synonyms as follows: Telamonia luxiensis
        (Peng, Yin, Yan &amp; Kim, 1998), syn. nov. (= Epeus bicuspidatus (Song, Gu
        &amp; Chen, 1988 )); Thyene radialis Xie &amp; Peng, 1995 was previously synonymised
        with Thyene orientalis Żabka, 1985; Thyene triangula Xie &amp; Peng, 1995,
        syn. nov. (= Ptocasius montiformis Song, 1991); Thyene zhangi (Peng, Yin,
        Yan &amp; Kim, 1998), syn. nov. (= Thyene orientalis Żabka, 1985).</p>","language":"eng","homepage":"https://tb.plazi.org/GgServer/summary/DF1866E12DDC554EB329E8A0D1AF0C80","citation":{"text":"Zhou
