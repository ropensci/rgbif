        en procesos como dispersión, polinización y regulación trófica (Martínez-Callejas
        et al., 2023; IAvH & ANH, 2022).","sampling":"El muestreo se realizó mediante
        un enfoque integrado y multicomponente para verificar en campo las coberturas
        reportadas para el DRMI Humedal San Silvestre y caracterizar la biodiversidad
        del Predio El Diviso. Previo al trabajo de campo se recopiló información secundaria
        reciente para construir listados de especies esperadas y contextualizar antecedentes.
        En campo, la flora se evaluó mediante transectos lineales tipo Gentry (50
        × 2 m) con subparcelas anidadas para incluir fustales (DAP ≥ 10 cm) y regeneración,
        registrando variables estructurales y realizando la identificación taxonómica
        con apoyo de claves y material de referencia (Gentry, 1982;  Gotelli & Colwell,
        2001Pedraza & Molina, 2007; Humboldt, 2021). La avifauna se registró mediante
        recorridos en transectos fijos durante el periodo de mayor actividad (06:00–09:00
        h), con detecciones visuales y auditivas apoyadas en registros fotográficos
        y herramientas de identificación, y se organizó la información en matrices
        de presencia/ausencia para estimar riqueza y similitud entre coberturas (MADS,
        2018; Humboldt, 2021; McMullan, 2023 ; Bustamante & Garitano-Zavala, 2024).
        Los mamíferos medianos y grandes se evaluaron mediante búsqueda de evidencias
