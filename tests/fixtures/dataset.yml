        (Platyhelminthes: Monogenea) from the gills of the African carp, Labeo coubie
        Rüppell (Cyprinidae), from Senegal, with descriptions of three new species
        of Dactylogyrus and the redescription of Dactylogyrus cyclocirrus Paperna,
        1973","description":"<p>This dataset contains the digitized treatments in
        Plazi based on the original journal article Musilová, Na Ď A, Ehulková, Eva
        Ř, Gelnar, Milan (2009): Dactylogyrids (Platyhelminthes: Monogenea) from the
        gills of the African carp, Labeo coubie Rüppell (Cyprinidae), from Senegal,
        with descriptions of three new species of Dactylogyrus and the redescription
        of Dactylogyrus cyclocirrus Paperna, 1973. Zootaxa 2241: 47-68, DOI: 10.5281/zenodo.190572</p><p>Abstract</p><p>The
        results of a systematic survey of monogeneans collected from the gills of
        the African carp, Labeo coubie (Cyprinidae) from the Gambia River basins in
        the Niokolo-Koba National Park, Senegal, are presented. The following 11 previously
        described species belonging to Dactylogyrus and Dogielius (Dactylogyridae)
        are reported: Dactylogyrus retroversus Guégan, Lambert &amp; Euzet, 1988,
        Dactylogyrus titus Guégan, Lambert &amp; Euzet, 1988, Dactylogyrus falcilocus
        Guégan, Lambert &amp; Euzet, 1988, Dactylogyrus decaspirus Guégan, Lambert
        &amp; Euzet, 1988, Dactylogyrus oligospirophallus Paperna, 1973, Dactylogyrus
        jaculus Guégan, Lambert &amp; Euzet, 1988, Dogielius anthocolpos Guégan, Lambert
        &amp; Euzet, 1989, Dogielius clavipenis Guégan, Lambert &amp; Euzet, 1989,
        Dogielius harpagatus Guégan, Lambert &amp; Euzet, 1989, Dogielius complicitus
        Guégan, Lambert &amp; Euzet, 1989, and Dogielius flagellatus Guégan, Lambert
        &amp; Euzet, 1989. Three new species of Dactylogyrus with 2 haptoral bars
        are described as follows: Dactylogyrus yassensis n. sp., Dactylogyrus dembae
        n. sp., and Dactylogyrus leonis n. sp. The sclerotized structures of type
        and voucher specimens of Dactylogyrus cyclocirrus Paperna, 1973, Dactylogyrus
        omega Guégan &amp; Lambert, 1991, and Dactylogyrus cf labeous Paperna, 1979
        are illustrated for comparative purposes. The type specimens indicate that
        D. cyclocirrus is based on specimens of two different species, among which
        the lectotype is designated from the syntypes collected from Labeo cylindricus.
        Dactylogyrus cyclocirrus of Guégan et al. (1988) and D. cf labeous Paperna,
        1979 are considered senior subjective synonyms of D. yassensis n. sp. and
        D. dembae n. sp., respectively.</p><p>Key words: Dactylogyridae; Dactylogyrus
