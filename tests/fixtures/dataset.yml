        according to a modified Tansley scale (Leyssen et al. 2005, Leyssen 2017).
        Using standardized evaluation criteria (Oosterlynck et al. 2020), the Research
        Institute for Nature and Forest (INBO) integrates these survey data to evaluate
        habitat quality and conservation trends in Flanders (Vanden Borre et al. 2025)
        for periodic reporting under the EU Habitats Directive.</p><p>This dataset
