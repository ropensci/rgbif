        - Botanical inventory of a number of natural flooding areas in the Demer catchment
        in Flanders, Belgium","description":"<p>This dataset was gathered as part
        of at study detailing the vegetation found in two flooding zones near to the
        Demer waterbody in Flanders, Belgium. More details are given under &#39;project
        data&#39; and &#39;sampling methods&#39;, but the most information is to be
        found in the original (Dutch) report cited (Butaye &amp; Hermy, 1997).</p><p>The
        vegetation data from this study has been stored in INBOVEG, the INBO vegetation
        record database (also part of the &#34;Global Index of Vegetation-plot databases&#34;
        and the &#34;European Vegetation Archive&#34;), and is being published here
        in its entirety. The GBIF dataset is the same as the data in INBOVeg. The
        relevant identification code is &#39;IV2013080209275885&#39;.</p><p>Full details
        of the sampling protocol, in Dutch, are given in the associated report: Butaye,
        J., Hermy, M. (1997). Botanische inventarisatie van een aantal overstromende
        natuurterreinen in het Demerbekken. IN-report, carried out by KULeuven on
        behalf of the Instutute of Nature Conservation, Brussels. </p><p>All data
        was recorded by trained experts.</p><p>Some of these datasets have been previously
        published on GBIF as part of the FLORABANK1 bulkdata publication (https://doi.org/10.3897/phytokeys.12.2849)
        at either a 1 km² or a 4 km² scale, here they are published as specific locations
        (with 10m² uncertainty). No coordinate uncertainty was noted in the accompanying
        report, so 10m² is only an estimate, based on the size of the plots (9 m²). </p><p>To
        allow anyone to use this dataset, we have released the data to the public
        domain under a Creative Commons Attribution waiver (https://creativecommons.org/licenses/by/4.0/).
