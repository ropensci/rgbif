        de lo Llanos","awards":[],"studyAreaDescription":"Este estudio se llevó a
        cabo en la reserva de aguas calientes ubicada en el Km 92 paratebueno, en
        el municipio de Paratebueno en el departamento de Cundinamarca (Figura 1).
        La práctica se realizó en el mes de agosto en un tramo de la quebrada de aguas
        calientes. Se eligieron tres transectos a lo largo de la quebrada (Tabla 1).
        Esta reserva se encuentra a 339 m.s.n.m. Durante el transcurso del año la
        temperatura varía entre 21°C a 32°C, humedad relativa de 85% (Pineda & Falla,
        2015). Este está conformado por una topografía de tipo montañoso ondulado
        rodeado de bosque húmedo tropical (Alfaro et al., 2013). Cuenta con diferentes
        ecosistemas como bosque de piedemonte, bosque secundario avanzado y bosque
        maduro intervenido.  Además cuenta con afloramiento de aguas subterráneas,
        aguas termales, quebrada, caño y humedales (Alfaro et al., 2013).","relatedProjects":[]},"samplingDescription":{"studyExtent":"Este
