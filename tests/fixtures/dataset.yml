        University in Olomouc (OL) was founded in 1946, collections from the period
        before this date are represented only sparsely. It contains approximately
        150,000 specimens, mostly of vascular plants, collected mainly in Central
        Europe. Collections from other regions of Europe and the world (Southeast
        Asia, South America, Oceania, Africa) are less represented. The annual increase
        currently amounts to approximately 3000-5000 specimens. A large part of the
        herbarium consists of collections of former and current employees of the department,
        as well as students, especially graduate students. Some taxonomically critical
