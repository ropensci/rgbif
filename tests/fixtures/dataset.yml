        de las coberturas vegetales, la biodiversidad y el uso actual del paisaje
        rural del predio El Diviso","title":"Caracterización de las coberturas vegetales,
        la biodiversidad y el uso actual del paisaje rural del predio El Diviso, vereda
        Peroles, DRMI Humedal San Silvestre, Barrancabermeja, Santander.","description":"<p>El
        predio El Diviso, ubicado en el área de influencia del Distrito Regional de
        Manejo Integrado (DRMI) Humedal San Silvestre en Barrancabermeja (Santander,
        Colombia), se caracteriza por un mosaico de coberturas vegetales representativo
        de la transición entre bosque seco tropical y bosque húmedo tropical del Magdalena
        Medio. El presente estudio tuvo como objetivo caracterizar la biodiversidad
        del predio mediante la evaluación de la composición florística, la diversidad
        de aves y la presencia de mamíferos medianos y grandes en distintas coberturas
        del paisaje. La vegetación fue evaluada mediante diez transectos lineales
        de 50 m siguiendo el método de Gentry, registrando individuos leñosos con
        diámetro a la altura del pecho ≥ 10 cm y estimando parámetros estructurales
        (densidad, frecuencia, dominancia e índice de valor de importancia). La diversidad
        se estimó mediante números de Hill (q0, q1 y q2). La avifauna fue registrada
        mediante recorridos de observación y registros auditivos, mientras que los
        mamíferos se documentaron mediante cámaras trampa y rastreo de huellas. Los
        resultados evidenciaron diferencias marcadas entre coberturas. La vegetación
        secundaria presentó los mayores valores de riqueza y diversidad florística,
        indicando estados sucesionales intermedios con mayor complejidad estructural.
        Los mosaicos de pastos con espacios naturales mostraron diversidad intermedia
        asociada a especies pioneras y de regeneración temprana, mientras que los
        pastos enmalezados exhibieron menor diversidad y mayor dominancia de especies
        oportunistas. Las zonas pantanosas presentaron comunidades vegetales más simples
        dominadas por especies tolerantes a suelos saturados. En total se registraron
        41 especies de plantas pertenecientes a 25 familias, junto ocho especies de
        mamíferos medianos y grandes, incluyendo Panthera onca y Puma concolor, así
        como 62 especies de aves asociadas principalmente a coberturas en regeneración.
        Estos resultados resaltan la importancia de los mosaicos de vegetación secundaria
        y humedales del DRMI Humedal San Silvestre como refugios de biodiversidad
        dentro del paisaje transformado del Magdalena Medio.</p>","language":"spa","homepage":"https://fundacioncuidarlatierra.org/","logoUrl":"https://gitlab.com/sib-colombia/logos/-/raw/main/socio-SiB-fundacuidartierra.png","citation":{"text":"Florez
