        napoensis (Salicaceae), a new species from Guangxi, China","description":"<p>This
        dataset contains the digitized treatments in Plazi based on the original journal
        article Xu, Ting, Ouyang, Zilong, Su, Zhiyong, Yang, Mei, Jia, Xianglu, Gong,
        Li (2026): Casearia napoensis (Salicaceae), a new species from Guangxi, China.
        PhytoKeys 279: 267-272, DOI: 10.3897/phytokeys.279.206429</p><p>Abstract</p><p>Casearia
        napoensis sp. nov. a new species from Guangxi, Southern China, is described
        and illustrated. The new species exhibits several distinguishing features:
        capsule 2.2–3 cm, spherical, leathery, orange-red at maturity, 4 - or 5 -
        valved, valves fleshy, 0.5 cm thick. Seeds up to 15–16 per fruit. The relationships
        among C. napoensis, C. membranacea and C. tardieuae are shortly discussed.
        The new species is endemic to limestone mountain forests of Western Guangxi,
        with its known distribution largely confined to the Guangxi Laohutiao Nature
        Reserve. On the basis of the IUCN criteria, it is assessed as Critically Endangered.</p>","language":"eng","homepage":"https://tb.plazi.org/GgServer/summary/37534E3D37DC51548560C60A69F780B2","citation":{"text":"Xu
