        (Scarabaeidae) de Colombia","title":"Listado de las especies de Dynastinae
        (Coleoptera: Scarabaeidae) de Colombia","description":"<p>Este recurso presenta
        el listado de las especies de Dynastinae (Coleoptera: Scarabaeidae) con ocurrencia
        conocida para el territorio colombiano. Se registran seis tribus, 44 géneros
        y 267 especies, de las cuales 39 son consideradas endémicas. El listado fue
        compilado a partir de la información disponible en catálogos especializados
        y literatura taxonómica reciente. Se incluyen las referencias de las descripciones
        originales y de los principales trabajos de revisión taxonómica del grupo.</p>","language":"spa","homepage":"https://sites.google.com/view/coleopcol/listados","logoUrl":"https://gitlab.com/sib-colombia/logos/-/raw/main/socio-SiB-coleocol.png","citation":{"text":"Niño-Suárez
