      string: '{"offset":0,"limit":1,"endOfRecords":false,"count":96,"results":[{"key":"436964a5-f408-4922-8112-4783f768b934","code":"PGM","name":"Palanga
        Amber Museum","description":"There are more than 5000 exhibits in the exposition
        of Palanga Amber Museum. The beginning of exposition contains information
        about amber formation. Diverse morphological forms of amber are exhibited
        in the Museum – drops, icicles, trunk and soil amber bundle. More than 70
        unique amber pieces valued not only for their impressive size (the largest
        piece so-called ‘Sun Stone’) but also because of their forms, nuances of colour,
        unique prints on the surfaces of ambers are exhibited in the Museum showcases.
        This is entire scientific material about climate conditions, fauna and flora
        on Earth during the formation time of amber (the Eocene period).\n\nPalanga
        Amber Museum has one of the largest and most scientifically valuable collections
        of inclusions worldwide (around 15 000 objects). In the showcases where exhibits
        could be examined through magnifying glass are introduced the most marvellous
        examples of amber inclusions, including one of the world’s rarest exhibits
        – the Lizard (Lat. Lacertidae).\n\nThe unique archaeological artefacts are
        exhibited in the museum: Neolithic amber articles which were found by archaeologist
        Dr. Rimutė Rimantienė while excavating and researching the Neolithic campsites
        complex of Šventoji. Juodkrantė Treasure’s (so-called collection of Richard
        Klebs, excavated by German company ‘Stantien und Becker’ in the Curonian Lagoon
        during 1862 and 1899) copies of the articles are also exhibited. These articles
        are valuable examples of applied art that reflect the worldview of people
        of the Baltic coast in the Neolithic period. In the museum it could be seen
        amber articles of the Stone Age and the Bronze Age period, archaeological
        material of the Baltic Sea coast’s burial sites.","types":["Museum"],"active":true,"email":["gintaro.muziejus@lndm.lt"],"phone":["+370
