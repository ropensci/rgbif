        Support Hub","description":"The Symbiota Support Hub provides accessible solutions
        and support for biodiversity collections to efficiently mobilize their data
        using Symbiota. Symbiota is an open source biodiversity data aggregation and
        collection management system software (https://github.com/BioKIC/Symbiota)
        that currently sustains a network of over 60 publicly-accessible data portals.
        Many of these portals are GBIF installations; they can push datasets directly
        to GBIF without the use of an IPT. Most portals welcome new data providers
        within their theme. To learn more about joining the Symbiota network, contact
        help@symbiota.org.","language":"eng","numConstituents":589,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"andrea","created":"2025-03-18T10:20:49.047+00:00","modified":"2025-03-28T07:39:38.882+00:00","contacts":[],"endpoints":[],"machineTags":[{"key":24444326,"namespace":"registry.gbif.org","name":"visibleOnDatasetPage","value":"true","createdBy":"andrea","created":"2025-03-28T07:40:49.621+00:00"}],"tags":[],"identifiers":[],"comments":[]},{"key":"55d38654-7954-46c6-ad18-7730a6a7f586","title":"The
        Program for Biodiversity Research (PPBio)","description":"The Program for
        Biodiversity Research (PPBio) is an innovative program designed to integrate
        all biodiversity research stakeholders in the Brazilian territory. Since its
        inception in 2004, PPBio has established a robust network of long-term ecological
        research sites across Brazil, with its methodology gaining traction in other
        countries in the Southern Hemisphere. This program supports a comprehensive
        suite of research activities essential for understanding biodiversity and
        the ecological and evolutionary processes shaping it. Currently, PPBio encompasses
        161 sampling sites most employing standardized methods that enable comparisons
        across all Brazilian ecosystems and their biomes, at various scales. To date,
        approximately 1,500 publications are associated with PPBio, encompassing diverse
        fields such as natural history, genetics, ecology, biodiversity, bioeconomy,
        sustainability, conservation, and climate change, among many others. The Program
        also fostered, directly and indirectly, local technical capacity building,
        and supported the training of hundreds of undergraduate and graduate students.
        The main challenge is maintaining the long-term funding necessary to understand
        biodiversity patterns and processes under pressure from global environmental
        changes. - http://memoria2.cnpq.br/web/guest/apresentacao-ppbio/","language":"eng","numConstituents":6,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"andrea","created":"2024-12-16T14:22:43.630+00:00","modified":"2024-12-16T14:27:28.076+00:00","contacts":[{"key":5929513,"type":"ADMINISTRATIVE_POINT_OF_CONTACT","primary":false,"userId":[],"firstName":"Geraldo","lastName":"Wilson
