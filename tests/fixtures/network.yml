        Moves","description":"Wild Moves (https://moves.wildlabs.net) is a data portal
        for animal tracking data. Want others to discover your animal tracking data
        and use it for research and conservation? Publish your dataset to GBIF, assign
        it to this network and it will automatically appear on Wild Moves.","language":"eng","numConstituents":497,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"peterdesmet","created":"2025-06-18T10:00:41.043+00:00","modified":"2026-02-09T15:49:24.647+00:00","contacts":[{"key":6144210,"type":"TECHNICAL_POINT_OF_CONTACT","primary":true,"userId":["https://orcid.org/0000-0002-8442-8025"],"firstName":"Peter","lastName":"Desmet","position":[],"email":["peter.desmet@inbo.be"],"phone":[],"homepage":[],"organization":"Research
