        — Réseau national des collections naturalistes (France)","description":"Récolnat
        is the French research infrastructure dedicated to facilitating access to
        natural history collections for scientific research. Established in 2013 and
        included since 2016 in the French Ministry of Higher Education and Research''s
        national roadmap for research infrastructures, Récolnat supports the standardisation,
        digitisation, and dissemination of collection data while fostering collaboration
        and expertise across the natural history community.\nIts core missions include
        improving data quality and curation, promoting best practices in collection
        management, providing cataloguing tools and support to smaller institutions,
        and contributing to the professionalisation of collection stewardship. Récolnat
        also operates the national gateway to France’s natural history collections
        through its online platform (https://recolnat.fr), which serves both as a
        discovery portal and as a collaborative data production and management tool
        for the broader community.\nAs a founding and active member of the Distributed
        System of Scientific Collections (DiSSCo ERIC), Récolnat serves as the French
        national node, contributing to the development of a unified European infrastructure
        for natural science collections.","language":"eng","numConstituents":0,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"andrea","created":"2026-06-08T06:21:02.857+00:00","modified":"2026-06-08T06:21:02.857+00:00","contacts":[{"key":7038051,"type":"ADMINISTRATIVE_POINT_OF_CONTACT","primary":true,"userId":[],"firstName":"François","lastName":"Dusoulier","position":["Director
