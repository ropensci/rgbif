        ERIC","description":"LifeWatch ERIC is a European Research Infrastructure
        Consortium providing e-Science research facilities to scientists investigating
        biodiversity and ecosystem functions and services in order to support society
        in addressing key planetary challenges. LifeWatch ERIC provides scientists
        and other users with access to biodiversity and ecosystem data, services and
        other research products by using and contributing to its advanced infrastructure
        to derive evidence-based knowledge for scientific and policy purposes.","language":"eng","numConstituents":1,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"andrea","created":"2026-05-19T07:28:11.815+00:00","modified":"2026-05-19T07:28:11.815+00:00","contacts":[{"key":7017914,"type":"ADMINISTRATIVE_POINT_OF_CONTACT","primary":true,"userId":[],"firstName":"Christos","lastName":"Arvanitidis","position":[],"email":["ceo@lifewatch.eu"],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"andrea","created":"2026-05-19T07:29:10.542+00:00","modified":"2026-05-19T07:29:10.542+00:00"}],"endpoints":[],"machineTags":[{"key":30998431,"namespace":"registry.gbif.org","name":"visibleOnDatasetPage","value":"true","createdBy":"andrea","created":"2026-05-19T07:29:52.798+00:00"}],"tags":[],"identifiers":[],"comments":[]},{"key":"68e8e67a-43e6-44a3-8817-dc0e6b70f973","title":"iDigBio","language":"eng","numConstituents":833,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"mgrosjean","modifiedBy":"mgrosjean","created":"2026-02-20T12:09:26.805+00:00","modified":"2026-02-20T12:09:26.805+00:00","contacts":[],"endpoints":[],"machineTags":[],"tags":[],"identifiers":[],"comments":[]},{"key":"80edc711-19b9-464c-a8b3-2cc15be80e26","title":"OSCA
        – Open Scientific Collections Austria","description":"The Open Scientific
        Collections Austria (OSCA) is a national consortium of 15 museums, universities,
        and scientific institutions holding outstanding natural science collections
        in Austria. OSCA aims to mobilize and harmonize collection data through a
        shared digital infrastructure, ensuring that data are Findable, Accessible,
        Interoperable, and Reusable (FAIR). By unlocking previously inaccessible collection
        data, OSCA transforms fragmented scientific holdings into an interconnected
        virtual information system, supporting research, collaboration, and the long-term
        preservation of Austria’s natural science heritage. More information is available
        at https://osca.science/.","language":"eng","numConstituents":14,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"andrea","created":"2026-02-04T10:06:17.830+00:00","modified":"2026-02-19T11:48:56.684+00:00","contacts":[{"key":6917748,"type":"ADMINISTRATIVE_POINT_OF_CONTACT","primary":false,"userId":[],"firstName":"OSCA","position":[],"description":"OSCA
