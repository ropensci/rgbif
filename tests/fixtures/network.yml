    body:
      string: '{"offset":0,"limit":100,"endOfRecords":true,"count":23,"results":[{"key":"5e061a4a-d7d6-472f-95fe-a602b05e464a","title":"NBFC
        - Italian National Biodiversity Future Center","description":"NBFC (National
        Biodiversity Future Center) is Italy''s national research center dedicated
        to biodiversity, with a strong focus on biodiversity conservation, ecological
        restoration, and long-term monitoring. It brings together a network of more
        than 3,000 researchers from public research institutions and universities,
        complemented by industrial partners, research consortia, and regional and
        local authorities. Through close collaboration with national parks, protected
        areas, and Marine Protected Areas (MPAs), NBFC carries out concrete field
        activities to assess and enhance biodiversity. These activities include monitoring
        species richness, genetic diversity, and ecosystem components, while implementing
        restoration and conservation actions aimed at strengthening ecosystem resilience.
        NBFC hosts a large community of taxonomic experts covering a broad range of
        plant, animal, fungal, and microbial groups. Their expertise supports the
        continuous updating of floristic and faunistic inventories, the production
        of high-quality taxonomic data, and the provision of authoritative information
        on species distribution and biodiversity status.\n\nThe Center also operates
        an advanced, multi-layered biodiversity data platform that integrates species
        occurrence records with molecular information (e.g., DNA barcoding and genomic
        data) and chemical data, including the characterization of secondary metabolites.
        This integrated infrastructure enables comprehensive biodiversity analyses
        across multiple levels of biological organization. In addition, NBFC coordinated
        the national project for the digitization of Italian herbaria during its first
        funding period and continues to support the national network connecting museums,
        universities, botanical gardens, and private collections. This ongoing effort
        contributes to the preservation, integration, and accessibility of Italy''s
        botanical heritage, strengthening biodiversity research and data sharing at
        both national and international levels.","language":"eng","numConstituents":8,"email":[],"phone":[],"homepage":[],"address":[],"createdBy":"andrea","modifiedBy":"andrea","created":"2026-07-27T12:47:18.168+00:00","modified":"2026-07-27T12:47:18.168+00:00","contacts":[{"key":7090712,"type":"ADMINISTRATIVE_POINT_OF_CONTACT","primary":false,"userId":[],"firstName":"Sarah","lastName":"Rossi
